<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Maria Eduarda — Contadora</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #1d1d1d;
    --paper: #f9f9f9;
    --graphite: #424242;
    --ash: #757575;
    --hairline: #e0e0e0;
    --cream: #efece5;
    --hairline-invert: rgba(255, 255, 255, 0.18);
    --sans: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
  }

  a { color: inherit; }

  .hero {
    background: var(--cream);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
  }

  .hero-inner {
    max-width: 72rem;
    margin: 0 auto;
    padding: 6rem 1.5rem;
    display: grid;
    grid-template-columns: 1fr;
    gap: 3rem;
  }

  @media (min-width: 768px) {
    .hero-inner {
      grid-template-columns: 1.1fr 0.9fr;
      align-items: center;
      padding: 8rem 2.5rem;
    }
  }

  .eyebrow {
    font-size: 0.75rem;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--ash);
    margin: 0 0 1.5rem;
  }

  h1 {
    font-weight: 800;
    letter-spacing: -0.035em;
    font-size: 3rem;
    line-height: 1.02;
    margin: 0;
  }

  @media (min-width: 640px) {
    h1 { font-size: 4rem; }
  }

  .headline {
    font-size: 1.125rem;
    color: var(--graphite);
    max-width: 28rem;
    margin: 2rem 0 0;
  }

  .cta-row {
    margin-top: 3rem;
    display: flex;
    align-items: center;
    gap: 1rem;
    flex-wrap: wrap;
  }

  .btn {
    display: inline-block;
    border: 1px solid var(--ash);
    padding: 0.75rem 1.5rem;
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    text-decoration: none;
    color: var(--ink);
    transition: background 0.2s ease, color 0.2s ease;
  }

  .btn:hover { background: var(--ink); color: var(--paper); }

  .photo-frame {
    max-width: 22rem;
    margin: 0 auto;
    aspect-ratio: 4 / 5;
    border: 1px solid var(--hairline);
    overflow: hidden;
  }

  .photo-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: grayscale(1);
    display: block;
  }

  .contact {
    padding: 6rem 1.5rem;
    max-width: 72rem;
    margin: 0 auto;
  }

  @media (min-width: 768px) {
    .contact {
      padding: 8rem 2.5rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5rem;
    }
  }

  .contact h2 {
    font-weight: 800;
    letter-spacing: -0.03em;
    font-size: 2.5rem;
    margin: 0 0 2.5rem;
  }

  .contact-links a {
    display: block;
    text-decoration: underline;
    text-underline-offset: 4px;
    text-decoration-color: var(--hairline);
    margin-bottom: 1rem;
    font-size: 0.95rem;
  }

  form { margin-top: 2.5rem; }

  @media (min-width: 768px) { form { margin-top: 0; } }

  .field { margin-bottom: 1.5rem; }

  label {
    display: block;
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ash);
    margin-bottom: 0.5rem;
  }

  input, textarea {
    width: 100%;
    border: none;
    border-bottom: 1px solid var(--hairline);
    background: transparent;
    padding: 0.5rem 0;
    font: inherit;
    color: var(--ink);
  }

  input:focus, textarea:focus {
    outline: none;
    border-bottom-color: var(--ink);
  }

  button {
    border: 1px solid var(--ink);
    background: transparent;
    padding: 0.75rem 1.5rem;
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
  }

  button:hover { background: var(--ink); color: var(--paper); }

  footer {
    border-top: 1px solid var(--hairline);
    padding: 2rem 1.5rem;
    text-align: center;
    font-size: 0.75rem;
    color: var(--ash);
  }
</style>
</head>
<body>

  <!--
    Fallback estático (HTML/CSS puro, sem framework JS) das seções Hero e
    Contato, conforme os deliverables do projeto. Reflete a mesma direção
    visual e os mesmos placeholders da versão Next.js em src/.
  -->

  <header class="hero">
    <div class="hero-inner">
      <div>
        <p class="eyebrow">Contadora</p>
        <h1>Maria Eduarda</h1>
        <p class="headline">[INSIRA CHAMADA CURTA — ex.: "Clareza e precisão em cada número"]</p>
        <div class="cta-row">
          <a class="btn" href="#contato">Falar com Maria</a>
        </div>
      </div>
      <div class="photo-frame">
        <img src="/images/maria-hero.svg" alt="Retrato de Maria Eduarda, contadora" />
      </div>
    </div>
  </header>

  <main class="contact" id="contato">
    <div>
      <h2>Vamos conversar?</h2>
      <div class="contact-links">
        <a href="mailto:[INSIRA EMAIL]">[INSIRA EMAIL]</a>
        <a href="[INSIRA LINK DO WHATSAPP]">WhatsApp</a>
      </div>
    </div>

    <form action="mailto:[INSIRA EMAIL]" method="post" enctype="text/plain">
      <div class="field">
        <label for="name">Nome</label>
        <input id="name" name="Nome" type="text" required />
      </div>
      <div class="field">
        <label for="email">E-mail</label>
        <input id="email" name="Email" type="email" required />
      </div>
      <div class="field">
        <label for="message">Mensagem</label>
        <textarea id="message" name="Mensagem" rows="3" required></textarea>
      </div>
      <button type="submit">Enviar</button>
    </form>
  </main>

  <footer>
    &copy; 2026 Maria Eduarda. Todos os direitos reservados.
  </footer>

</body>
</html>
