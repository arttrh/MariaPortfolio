<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" role="img" aria-labelledby="t d">
  <title id="t">Espaço reservado para a fotografia de Maria Eduarda</title>
  <desc id="d">Substituir por uma fotografia profissional em preto e branco antes da publicação.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#f4f2ec" />
      <stop offset="100%" stop-color="#e6e2d8" />
    </linearGradient>
  </defs>

  <rect width="1600" height="700" fill="url(#bg)" />

  <!-- Marca-d'água tipográfica -->
  <text x="800" y="370" text-anchor="middle"
        font-family="Inter, Arial, Helvetica, sans-serif"
        font-size="150" font-weight="800" letter-spacing="-5"
        fill="#1d1d1d" fill-opacity="0.06">maria eduarda</text>

  <text x="800" y="540" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="30" font-weight="700" letter-spacing="-0.5" fill="#212121" fill-opacity="0.72">Fotografia de Maria Eduarda</text>
  <text x="800" y="580" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="17" fill="#757575">substituir este placeholder antes da publicação</text>
</svg>
