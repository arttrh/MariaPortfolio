<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 860" role="img" aria-labelledby="t d">
  <title id="t">Espaço reservado para o retrato recortado de Maria Eduarda</title>
  <desc id="d">Substituir por um PNG com fundo transparente, enquadrado da cintura para cima.</desc>

  <!--
    Tons médios de propósito: o placeholder precisa aparecer tanto sobre o
    creme claro quanto sobre o fundo escuro do tema noturno.
  -->
  <defs>
    <linearGradient id="figure" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#9a9a9a" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#8a8a8a" stop-opacity="0.32" />
    </linearGradient>
  </defs>

  <!-- Silhueta meio-corpo: cabeça, ombros e tronco, sangrando na base. -->
  <g fill="url(#figure)">
    <circle cx="310" cy="212" r="132" />
    <path d="M310 366
             c 112 0 196 62 224 158
             c 18 62 26 130 28 196
             c 1 42 2 84 2 140
             H 56
             c 0 -56 1 -98 2 -140
             c 2 -66 10 -134 28 -196
             c 28 -96 112 -158 224 -158 Z" />
  </g>

  <!-- Moldura tracejada indicando que é um slot de imagem. -->
  <rect x="10" y="10" width="600" height="840" rx="14"
        fill="none" stroke="#9a9a9a" stroke-opacity="0.5"
        stroke-width="2" stroke-dasharray="10 9" />

  <text x="310" y="712" text-anchor="middle"
        font-family="Inter, Arial, Helvetica, sans-serif"
        font-size="27" font-weight="800" letter-spacing="-0.6"
        fill="#8f8f8f">Retrato de Maria</text>
  <text x="310" y="748" text-anchor="middle"
        font-family="Inter, Arial, Helvetica, sans-serif"
        font-size="15" fill="#8f8f8f" fill-opacity="0.85">PNG recortado, fundo transparente</text>
</svg>
